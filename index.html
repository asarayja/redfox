<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redfox sin verden</title>
  <!-- deling:start (oppdateres automatisk av admin når du publiserer) -->
  <meta name="description" content="Den røde reven fra tundraen – med album fulle av tull, tøys og fengende låter.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Redfox sin verden">
  <meta property="og:title" content="Redfox sin verden">
  <meta property="og:description" content="Den røde reven fra tundraen – med album fulle av tull, tøys og fengende låter.">
  <meta property="og:url" content="https://asarayja.github.io/redfox/">
  <meta property="og:image" content="https://asarayja.github.io/redfox/bilder/deling.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- deling:slutt -->
  <meta name="theme-color" content="#06121a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef6f9" media="(prefers-color-scheme: light)">
  <script>try{var t=localStorage.getItem('rf-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="bilder/ikon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Hopp til innhold</a>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <img src="bilder/ikon.png" alt="" width="34" height="34">
        <span id="brandText">Redfox</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home" data-t="nav_home">Hjem</a>
        <a href="#/musikk" data-route="music" data-t="nav_music">Musikk</a>
        <a href="#/om" data-route="about" data-t="nav_about">Om Redfox</a>
        <a href="#/bilder" data-route="gallery" data-t="nav_gallery">Bilder</a>
      </nav>
      <div class="top-tools">
        <button class="icon-btn" id="themeBtn" aria-label="Bytt tema">☀</button>
        <button class="icon-btn lang" id="langBtn" aria-label="Bytt språk">EN</button>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Meny" aria-expanded="false" aria-controls="nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading" aria-label="Laster"><span></span><span></span><span></span></div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a class="brand" href="#/">
        <img src="bilder/ikon.png" alt="" width="34" height="34">
        <span id="footerText">Redfox</span>
      </a>
      <p class="footer-meta"><span id="madeWith">Laget med</span> 🦊 · <span id="year"></span></p>
    </div>
  </footer>

  <div class="queue-panel glass" id="queuePanel" hidden>
    <div class="queue-head">
      <h2 data-t="up_next">Neste</h2>
      <button class="pl-btn" id="queueClose" aria-label="Lukk">×</button>
    </div>
    <ol class="queue-list" id="queueList"></ol>
  </div>

  <div class="player glass" id="player" hidden>
    <div class="pl-now">
      <div class="pl-cover" id="plCover"></div>
      <div class="pl-meta">
        <strong id="plTitle"></strong>
        <a id="plAlbum" href="#/"></a>
      </div>
    </div>
    <div class="pl-center">
      <div class="pl-controls">
        <button class="pl-btn pl-toggle" id="plShuffle"></button>
        <button class="pl-btn" id="plPrev"></button>
        <button class="pl-btn pl-play" id="plPlay"></button>
        <button class="pl-btn" id="plNext"></button>
        <button class="pl-btn pl-toggle" id="plRepeat"></button>
      </div>
      <div class="pl-progress">
        <span id="plTime">0:00</span>
        <input type="range" class="range" id="plSeek" min="0" max="1000" value="0">
        <span id="plDur">0:00</span>
      </div>
    </div>
    <div class="pl-side">
      <button class="pl-btn" id="plQueue"></button>
      <input type="range" class="range pl-vol" id="plVol" min="0" max="1" step="0.01">
      <button class="pl-btn pl-close" id="plClose">×</button>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Lukk">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Forrige">‹</button>
    <figure>
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Neste">›</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
